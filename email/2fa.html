<!DOCTYPE html>
<html>
<head>
    <title>Mã Xác Thực Của Bạn</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        .container { border: 1px solid #ddd; padding: 20px; border-radius: 8px; display: inline-block; }
        .code { font-size: 24px; font-weight: bold; letter-spacing: 5px; color: #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Xác Thực Hai Yếu Tố (2FA)</h2>
        <p>Mã xác thực của bạn là:</p>
        <p class="code">{{.Code}}</p>
        <p>Mã này sẽ hết hạn sau 5 phút. Vui lòng không chia sẻ mã này với bất kỳ ai.</p>
    </div>
</body>
</html>
