# k8s config map example
# secret for sensitive data, notice that values are base64 encoded
# echo -n 'yourencodedvaluehere' | base64

apiVersion: v1
kind: Secret
metadata:
  name: my-app-secret
type: Opaque
data:
  DATABASE_USER: some_encoded_value== # encoded base64
  DATABASE_PASSWORD: some_encoded_value== # encoded base64
